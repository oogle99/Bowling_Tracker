{% extends "base.html" %}

{% block content %}
<h1>Confirm Delete</h1>

<p>Are you sure you want to delete this split?</p>

<p>
    <strong>{{ split.layout }}</strong>
    worth
    <strong>${{ split.value }}</strong>
</p>

<form action="" method="post">
    <button type="submit">Yes, Delete</button>
    <a href="{{ url_for('splits') }}">Cancel</a>
</form>
{% endblock %}
